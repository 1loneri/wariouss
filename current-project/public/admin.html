<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>wariouss.vp — admin</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#070707;color:#ccc;font-family:"Space Grotesk",sans-serif}.wrap{max-width:1300px;margin:auto;padding:30px}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #242424;padding-bottom:20px}.brand{font-size:25px}.back{color:#999;text-decoration:none;font:12px "DM Mono"}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card,.panel{background:#101111;border:1px solid #292929;border-radius:12px;padding:20px}.label{font:10px "DM Mono";color:#777}.value{font:30px "DM Mono";margin-top:8px}.panel{margin-top:18px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #222;font:12px "DM Mono"}button,input{background:#171818;color:#ddd;border:1px solid #333;padding:8px;border-radius:6px}button{cursor:pointer}input{width:100px}.reset-vp{min-width:110px;font-weight:600}.muted{color:#777}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.wrap{padding:16px}table{font-size:10px}}</style></head><body><div class="wrap"><div class="head"><div class="brand">wariouss.vp / ADMIN</div><a class="back" href="/">← сайт</a></div><div class="stats"><div class="card"><div class="label">ПОЛЬЗОВАТЕЛИ</div><div class="value" id="users">—</div></div><div class="card"><div class="label">ОЧКИ</div><div class="value" id="points">—</div></div><div class="card"><div class="label">VP</div><div class="value" id="vp">—</div></div><div class="card"><div class="label">ТРАНЗАКЦИИ</div><div class="value" id="tx">—</div></div></div><section class="panel"><h2>Пользователи</h2><table><thead><tr><th>USER</th><th>POINTS</th><th>VP</th><th>WATCH</th><th>ИЗМЕНИТЬ ОЧКИ</th><th>УБРАТЬ VP</th></tr></thead><tbody id="userRows"></tbody></table></section><section class="panel"><h2>Последние операции</h2><table><thead><tr><th>USER</th><th>TYPE</th><th>POINTS</th><th>VP</th><th>DATE</th></tr></thead><tbody id="txRows"></tbody></table></section></div><script>const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('ru-RU');async function api(p,o){const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');return d}async function load(){try{let s=await api('/api/admin/stats');$('users').textContent=fmt(s.users);$('points').textContent=fmt(s.points);$('vp').textContent=fmt(s.vp);$('tx').textContent=fmt(s.transactions);let u=await api('/api/admin/users');$('userRows').innerHTML=u.users.map(x=>`<tr><td>${x.display_name}</td><td>${fmt(x.points)}</td><td>${fmt(x.vp)}</td><td>${Math.floor(x.watch_seconds/60)}m</td><td><input id="d-${x.id}" placeholder="+/-"/><button onclick="adjust(${x.id})">OK</button></td><td><button class="reset-vp" onclick="resetVp(${x.id})">УБРАТЬ VP</button></td></tr>`).join('');let t=await api('/api/admin/transactions');$('txRows').innerHTML=t.transactions.map(x=>`<tr><td>${x.display_name}</td><td>${x.type}</td><td>${x.points_delta}</td><td>${x.vp_delta}</td><td>${new Date(x.created_at).toLocaleString('ru-RU')}</td></tr>`).join('')}catch(e){document.body.innerHTML='<div style="padding:40px;font-family:monospace">'+e.message+'</div>'}}async function adjust(id){const delta=Number($('d-'+id).value);if(!Number.isInteger(delta))return alert('Введите целое число');try{await api('/api/admin/users/'+id+'/points',{method:'POST',body:JSON.stringify({delta})});await load()}catch(e){alert(e.message)}}async function resetVp(id){if(!confirm('Точно обнулить VP этого пользователя?'))return;try{await api('/api/admin/users/'+id+'/vp/reset',{method:'POST'});await load()}catch(e){alert(e.message)}}load();</script></body></html>
